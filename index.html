<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRPG 跑團介面產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ed-bg:#14111c; --ed-panel:#1d1828; --ed-line:#342b46; --ed-text:#e6def5; --ed-dim:#9a8fb0; --ed-acc:#9b6cf0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0910;color:var(--ed-text);font-family:"Noto Serif TC","Microsoft JhengHei",serif}
#app{display:flex;height:100vh}
/* ================= 編輯器 ================= */
#editor{width:420px;flex:none;overflow-y:auto;background:var(--ed-bg);border-right:1px solid var(--ed-line);padding:12px 14px 40px;font-family:"Microsoft JhengHei",sans-serif;font-size:13px}
#editor h1{font-size:17px;margin:4px 0 10px;letter-spacing:1px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button,.btn{background:#2a2238;color:var(--ed-text);border:1px solid var(--ed-line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover,.btn:hover{border-color:var(--ed-acc)}
button.primary{background:var(--ed-acc);border-color:var(--ed-acc);color:#fff}
details{background:var(--ed-panel);border:1px solid var(--ed-line);border-radius:8px;margin-bottom:8px}
summary{padding:8px 10px;cursor:pointer;font-weight:bold;user-select:none}
.sec{padding:4px 10px 10px}
label.f{display:block;margin:6px 0 2px;color:var(--ed-dim);font-size:12px}
input[type=text],input[type=number],textarea,select{width:100%;background:#0f0c16;color:var(--ed-text);border:1px solid var(--ed-line);border-radius:5px;padding:5px 7px;font:inherit}
input[type=color]{width:44px;height:28px;border:none;background:none;padding:0}
textarea{resize:vertical;min-height:80px;line-height:1.5}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1;min-width:0}
.row>.nf{flex:none}
.img-in{display:flex;gap:4px}
.img-in input{flex:1}
.img-in .btn{flex:none;padding:5px 8px;font-size:12px}
.char{border:1px solid var(--ed-line);border-radius:7px;padding:6px 8px 8px;margin:8px 0;background:#18131f}
.char-h{display:flex;align-items:center;gap:4px;font-weight:bold}
.char-h span{flex:1}
.char-h button{padding:2px 7px;font-size:12px}
.hint{color:var(--ed-dim);font-size:11.5px;line-height:1.5;margin:4px 0}
.hint code{background:#0f0c16;padding:0 4px;border-radius:3px;color:#c9b6f5}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3a2456;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:99;font-family:sans-serif;font-size:13px}
#toast.show{opacity:1}

/* ================= 預覽區 ================= */
#wrap{flex:1;position:relative;overflow:hidden;background:#050407}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
body.output #editor{display:none}

/* ================= 跑團畫面 ================= */
#stage{
  /* 基礎 5 色由 JS 設定（對應 Realtime Colors：text / background / primary / secondary / accent） */
  --text:#ece6f6; --bg:#0b0910; --pri:#bea0e6; --sec:#c9a96e; --acc:#8b5cf6;
  --hp:#e5485d; --mp:#5b8cf0; --san:#4fd394; --shadow:rgba(0,0,0,.6);
  --p1:color-mix(in srgb,var(--bg) 90%,var(--pri) 10%);
  --p2:color-mix(in srgb,var(--bg) 96%,var(--pri) 4%);
  --chip:color-mix(in srgb,var(--bg) 78%,var(--pri) 22%);
  --line:color-mix(in srgb,var(--pri) 42%,transparent);
  --line2:color-mix(in srgb,var(--pri) 20%,transparent);
  --dim:color-mix(in srgb,var(--text) 62%,var(--bg));
  --soft:color-mix(in srgb,var(--text) 86%,var(--bg));
  color:var(--text);font-family:"Noto Serif TC",serif;
  display:grid;padding:16px;gap:14px;
  grid-template-columns:400px 1fr 400px;grid-template-rows:1fr 100px;
}
#stage[data-mode=light]{--hp:#c8283f;--mp:#2f5fd0;--san:#13915a;--shadow:rgba(60,40,90,.16)}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.panel{position:relative;background:linear-gradient(180deg,var(--p1),var(--p2));border:1px solid var(--line);
  box-shadow:inset 0 0 0 4px var(--p2),inset 0 0 0 5px var(--line2),0 0 18px var(--shadow);min-height:0;overflow:hidden}
.panel::before,.panel::after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--sec);opacity:.6;pointer-events:none;z-index:3}
.panel::before{left:3px;top:3px;border-right:none;border-bottom:none}
.panel::after{right:3px;bottom:3px;border-left:none;border-top:none}
.ph{text-align:center;padding:12px 0 6px;position:relative}
.ph .t{font-size:22px;letter-spacing:3px;font-weight:600}
.ph .e{font-family:Cinzel,serif;font-size:11px;letter-spacing:3px;color:var(--dim);margin-top:2px}
.ph::after{content:"";display:block;margin:6px auto 0;width:70%;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.ph .t::before,.ph .t::after{content:"✦";color:var(--acc);font-size:12px;margin:0 12px;vertical-align:middle;opacity:.85}

/* 角色 */
/* 可自訂背景圖的欄位（角色狀態、VTuber 區） */
.panel-bg{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;transform-origin:center;pointer-events:none;z-index:0}
#p-chars>.ph,#chars{position:relative;z-index:1}
#p-chars{flex:1;display:flex;flex-direction:column}
#chars{flex:1;justify-content:flex-start;display:flex;flex-direction:column;gap:8px;padding:4px 10px 10px;min-height:0}

/* 主持人 */
#p-kp{height:120px;flex:none;display:flex;align-items:center;gap:18px;padding:0 24px;
  background:radial-gradient(circle at 80% 50%,color-mix(in srgb,var(--acc) 18%,transparent),transparent 60%),linear-gradient(180deg,var(--p1),var(--p2))}
#p-kp .kav{flex:none;width:80px;height:80px;border-radius:50%;background:var(--chip) center/cover no-repeat;border:2px solid var(--sec);display:grid;place-items:center;font-size:40px;box-shadow:0 0 18px color-mix(in srgb,var(--acc) 55%,transparent)}
#p-kp .kn{font-size:28px;font-family:Cinzel,"Noto Serif TC",serif}
#p-kp .ks{font-family:Cinzel,serif;letter-spacing:3px;color:var(--dim);font-size:13px}

/* 劇情 */
/* 劇情畫面挖空：只留外框，裡面透明，OBS 放在下面的圖片／畫面會透出來 */
#p-scene{flex:none;aspect-ratio:16/9;background:transparent}
/* 整體底色畫在 ::before，並用遮罩把劇情畫面的位置挖掉（--hx/--hy/--hw/--hh 由 JS 依版面設定） */
#stage::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--bg) 86%,var(--pri) 14%) 0%,var(--bg) 70%);
  -webkit-mask-image:linear-gradient(#000,#000),linear-gradient(#000,#000);mask-image:linear-gradient(#000,#000),linear-gradient(#000,#000);
  -webkit-mask-size:100% 100%,var(--hw,0px) var(--hh,0px);mask-size:100% 100%,var(--hw,0px) var(--hh,0px);
  -webkit-mask-position:0 0,var(--hx,0px) var(--hy,0px);mask-position:0 0,var(--hx,0px) var(--hy,0px);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-composite:xor;mask-composite:exclude}
/* 輸出畫面背景全透明（OBS 瀏覽器來源才透得過去） */
html:has(body.output),body.output,body.output #wrap{background:transparent!important}
/* 劇情畫面右上角的資訊牌：每行「前段（次色）＋後段（文字色）」，例：地點　S市（空的那行不顯示，全空就整塊隱藏） */
.sinfo{position:absolute;top:18px;right:18px;max-width:60%;padding:.45em .9em;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.15em .7em;align-items:baseline;line-height:1.35;letter-spacing:1px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--p1) 90%,transparent),color-mix(in srgb,var(--bg) 90%,transparent));border:1px solid var(--line);
  box-shadow:inset 0 0 0 3px var(--p2),inset 0 0 0 4px var(--line2),0 0 14px var(--shadow)}
.sinfo:empty{display:none}
.sinfo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sinfo .a{color:var(--sec)}
.sinfo .solo{grid-column:1/-1}
/* 裝飾：front = 前面、both = 前後、none = 無 */
.sinfo:is([data-deco=front],[data-deco=both]) :is(.a,.solo)::before{content:"✦";color:var(--acc);margin-right:.45em;font-size:.55em;vertical-align:.25em}
.sinfo[data-deco=both] .b::after{content:"✦";color:var(--acc);margin-left:.45em;font-size:.55em;vertical-align:.25em}
.lower{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* 雜談區關閉時，對話區延伸成一整條 */
.lower.solo{grid-template-columns:1fr}

/* 右側 */
/* VTuber 格：改用強調色＋次色，跟其他欄位區隔 */
#p-vt{height:420px;flex:none;border-color:color-mix(in srgb,var(--sec) 75%,transparent);
  background:radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--acc) 26%,transparent),transparent 72%),
    linear-gradient(180deg,color-mix(in srgb,var(--bg) 78%,var(--acc) 22%),color-mix(in srgb,var(--bg) 90%,var(--sec) 10%));
  box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--bg) 85%,var(--acc) 15%),inset 0 0 0 5px color-mix(in srgb,var(--sec) 50%,transparent),
    0 0 26px color-mix(in srgb,var(--acc) 40%,transparent)}
#p-vt::before,#p-vt::after{width:34px;height:34px;border-color:var(--acc);opacity:.95}
/* VTuber 框頂部的自由文字，避免擋到 Live2D */
#p-tw{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:14px;max-width:calc(100% - 40px);
  padding:8px 26px;border:1px solid var(--sec);border-radius:30px;background:color-mix(in srgb,var(--bg) 82%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 35%,transparent)}
#p-tw .tw{font-size:19px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#p-chat{flex:1}
#p-notes{height:220px;flex:none}
#notes{padding:2px 28px;font-size:18px;line-height:1.9}
#notes div::before{content:"・";color:var(--acc)}

/* 底部 */
#bar{grid-column:1/-1;display:flex;align-items:center;gap:26px;padding:0 30px}
.badge{flex:none;font-family:Cinzel,serif;font-size:15px;letter-spacing:2px;padding:8px 26px;text-align:center;line-height:1.25;
  border:1px solid var(--sec);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);background:linear-gradient(180deg,var(--chip),var(--p2))}
#bar .ttl{font-size:32px;font-weight:700;letter-spacing:3px;line-height:1.1}
#bar .stl{font-size:16px;color:var(--dim);font-family:Cinzel,"Noto Serif TC",serif}
#bar .tags{display:flex;gap:28px;font-size:18px;color:var(--soft)}
#bar .sp{flex:1}
#bar .sp-r{flex:.3}
/* 時間由 OBS 疊上，這裡只留空位 */
#bar .time-slot{flex:none;width:180px}

/* 編輯器：配色區 */
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.swatches label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ed-dim);text-align:center}
.swatches input[type=color]{width:100%;height:32px}
.seg{display:flex;margin-top:2px}
.seg button{flex:1;border-radius:0}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--ed-acc);border-color:var(--ed-acc);color:#fff}
[hidden]{display:none!important}

/* ================= CCFOLIA 狀態條 ================= */
/* 角色格（OBS 疊 CCFOLIA 瀏覽器來源的位置） */
.slot{flex:none;box-sizing:border-box;padding:6px;position:relative;
  border:1px solid var(--line2);background:linear-gradient(90deg,color-mix(in srgb,var(--chip) 60%,transparent),color-mix(in srgb,var(--p2) 50%,transparent))}
/* 編輯器預覽：疊在畫面上的 CCFOLIA 模擬畫面（OBS 輸出畫面沒有這層） */
#sbLayer,#voiceLayer{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none;overflow:hidden}
/* 語音：Reactive 的單人頭像預覽（實際在 OBS 是每個角色各自的瀏覽器來源，輸出畫面沒有這層） */
#voiceLayer iframe{position:absolute;border:0;background:transparent;overflow:hidden;color-scheme:normal}
#sbLayer iframe{position:absolute;border:0;background:transparent;transform-origin:0 0;color-scheme:normal}
body.output #sbLayer,body.output #voiceLayer{display:none}
/* 編輯器：狀態條設定 */
.sb-tabs{display:flex;gap:2px;border-bottom:1px solid var(--ed-line);margin:8px 0 2px}
.sb-tabs button{flex:1;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--ed-dim);padding:6px 2px;white-space:nowrap}
.sb-tabs button.on{color:var(--ed-text);border-bottom-color:var(--ed-acc);font-weight:bold}
.sgroup{color:var(--ed-dim);font-size:11px;letter-spacing:.08em;margin:12px 0 0;padding-top:8px;border-top:1px solid var(--ed-line)}
.sr{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;align-items:center;margin-top:7px}
.sr>.sl{color:var(--ed-dim);font-size:12px}
.wv{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:6px;align-items:center}
.ca{display:grid;grid-template-columns:44px minmax(0,1fr) 40px;gap:6px;align-items:center}
.wv output,.ca output{color:var(--ed-dim);text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
#editor input[type=range]{width:100%;accent-color:var(--ed-acc)}
.ck{display:flex;align-items:center;gap:6px;cursor:pointer}
.cks{display:grid;gap:4px}
.pcf{display:flex;gap:4px}
.pcf input{flex:1;min-width:0}
.pcf button{flex:none;padding:4px 8px;font-size:12px}
.sb-bar{display:grid;grid-template-columns:16px minmax(0,1fr) 30px 30px 76px 16px;gap:4px;align-items:center;margin-top:4px}
.sb-bar input[type=color]{width:100%;height:26px}
.sb-bar.head{color:var(--ed-dim);font-size:11px}
.sb-deco{border:1px solid var(--ed-line);border-radius:6px;padding:6px 8px;margin-top:6px}
.sb-deco>.ck{font-weight:bold}
.sb-deco>.ck small{color:var(--ed-dim);font-weight:normal}
.obsline{font-size:11.5px;color:#c9b6f5;margin-top:6px;line-height:1.6}
.obsline.warn{color:#ffb86b}
.charbtns{display:flex;gap:4px;margin-top:6px}
.charbtns button{padding:3px 9px;font-size:12px}
.note-ol{margin:4px 0;padding-left:1.3em;color:var(--ed-dim);font-size:11.5px;line-height:1.7}
.note-ol b{color:var(--ed-text)}
</style>
</head>
<body>
<div id="app">
  <aside id="editor"></aside>
  <main id="wrap"><div id="stage"></div><div id="voiceLayer"></div><div id="sbLayer"></div></main>
</div>
<div id="toast"></div>

<!-- CCFOLIA 狀態條：沿用 scTool（shiki365「ステータスバーメーカー」繁中版，MIT License）的核心模組 -->
<script src="statusbar/presets.v1.js"></script>
<script src="statusbar/shapes.v1.js"></script>
<script src="statusbar/model.v1.js"></script>
<script src="statusbar/deco.v1.js"></script>
<script src="statusbar/css.v1.js"></script>
<script src="statusbar/mock.v1.js"></script>
<script src="statusbar/pcfonts.v1.js"></script>
<script>
const KEY = 'trpg-overlay-v1';
const OUTPUT = new URLSearchParams(location.search).get('view') === 'output';
// OBS 瀏覽器來源讀不到 Chrome 的存檔，所以設定直接壓縮編在網址 #s= 後面（「複製 OBS 網址」產生）
const PACKED = OUTPUT && location.hash.startsWith('#s=') ? location.hash.slice(3) : '';
if (OUTPUT) document.body.classList.add('output');
const bc = 'BroadcastChannel' in window ? new BroadcastChannel(KEY) : null;
const P = window.BarPresets, M = window.BarModel, C = window.BarCss, K = window.BarMock;

// 跑團介面用的狀態條範本，排在範本清單第一個
const STAT_COLORS = { dark: { hp: '#e5485d', mp: '#5b8cf0', san: '#4fd394' }, light: { hp: '#c8283f', mp: '#2f5fd0', san: '#13915a' } };
P.DESIGNS = {
  overlay: {
    label: '跑團介面風（預設）', desc: '配合這個跑團介面：頭像在左、名字在狀態條上方、切角狀態條，寬度剛好放進左欄的角色格。勾選「顏色跟隨介面配色」時會自動換色。',
    layout: { width: 240, height: 16, gap: 8, textLayout: 'side', labelW: 44, valueW: 74, textGap: 6, outer: 8 },
    avatar: { show: true, pos: 'left', w: 92, h: 92, radius: 6, borderW: 1, useCharColor: true, fit: 'top', gap: 10 },
    initiative: { show: true, size: 22, corner: 'tl' },
    bar: { shape: 'chamfer', cut: 5, borderW: 1, borderAlpha: 0.5, track: 'dark', trackAlpha: 0.7, fill: 'vgrad', shadow: 0.3 },
    colors: [['#e5485d', '#7e2733', 'heart'], ['#5b8cf0', '#324d84', 'sparkle'], ['#4fd394', '#2b7451', 'eye'], ...P.BASE_LOOK.colors.slice(3).map(c => [c.c1, c.c2, c.icon])].map(([c1, c2, icon]) => ({ c1, c2, icon })),
    text: { labelFont: 'cinzel', valueFont: 'cinzel', weight: 600, labelSize: 14, valueSize: 18, maxSize: 12, spacing: 0.04, labelByBar: true, outline: 'shadow' },
    name: { pos: 'barsTop', style: 'text', font: 'notoserif', weight: 700, size: 20, gap: 4 },
  },
  ...P.DESIGNS,
};
function defaultSb() { const sb = M.defaultState(); M.applyDesign(sb, 'overlay'); return sb; }

const DEFAULT = {
  title: '迷霧中的低語', subtitle: 'Call of Cthulhu 7th edition',
  hashtags: '#TRPG實況 #CoC7th #微醺染香', twitter: '@senkakira',
  // 劇情畫面右上角的資訊牌：lines 行數（1/2）、deco 裝飾（front 前面 / both 前後 / none 無）、size 字體大小 px
  // a = 前段（次色）、b = 後段（文字色），1～5 是第幾行（最多 SINFO_MAX 行）；sizeA / sizeB 是前段 / 後段的字體大小
  scene: { lines: 2, a1: '時間', b1: '1925年10月3日　深夜', a2: '地點', b2: '阿卡姆・米斯卡托尼克大學', a3: '', b3: '', a4: '', b4: '', a5: '', b5: '', deco: 'front', sizeA: 16, sizeB: 22 },
  characters: [
    { name: '艾莉亞', color: '#c084fc', ccf: '', voice: '', voiceX: 280, voiceSize: 90 },
    { name: '雷恩', color: '#f87171', ccf: '', voice: '', voiceX: 280, voiceSize: 90 },
    { name: '莉薇婭', color: '#fb7185', ccf: '', voice: '', voiceX: 280, voiceSize: 90 },
    { name: '凱爾', color: '#60a5fa', ccf: '', voice: '', voiceX: 280, voiceSize: 90 },
  ],
  // sizes: 編輯器量到的各角色瀏覽器來源尺寸，OBS 輸出畫面靠它排出一樣的角色格
  ccf: { room: '', followTheme: true, sizes: [] },
  sb: defaultSb(),
  talk: { show: true },   // 雜談區；不顯示時對話區延伸成一整條
  kp: { show: false, name: '主持人', sub: 'GAME MASTER', avatar: '', icon: '🐙' },
  notes: '小鎮的異常氣味\n失蹤的鎮民\n教堂地下室的聲音\n奇怪的符號',
  charsBg: { img: '', opacity: 50, fit: 'contain', zoom: 100, x: 0, y: 0 },
  vtBg: { img: '', opacity: 50, fit: 'contain', zoom: 100, x: 0, y: 0 },
  theme: { mode: 'dark', colors: { text: '#ece6f6', bg: '#0b0910', pri: '#bea0e6', sec: '#c9a96e', acc: '#8b5cf6' } },
};

let state = load();
// 舊資料或匯入的 JSON 補齊缺少的欄位
function fixState(s) {
  if (s.kp?.name === 'KP' && s.kp.sub === 'KEEPER') Object.assign(s.kp, { name: '主持人', sub: 'GAME MASTER' });
  // 劇情資訊牌舊版資料搬到新欄位：時間／地點 → 前段標籤＋後段；只有一段文字的版本 → 放在後段
  const sc = s.scene;
  if (sc && sc.b1 === undefined) {
    if (sc.time !== undefined || sc.place !== undefined) Object.assign(sc, { a1: '時間', b1: sc.time || '', a2: '地點', b2: sc.place || '' });
    else if (sc.line1 !== undefined) Object.assign(sc, { a1: '', b1: sc.line1 || '', a2: '', b2: sc.line2 || '' });
    const size = (sc.lines == 2 ? sc.size2 : sc.size1) ?? sc.size;
    if (size !== undefined) sc.sizeB = size;
  }
  for (const k of ['charsBg', 'vtBg', 'ccf', 'scene', 'talk']) s[k] = { ...DEFAULT[k], ...s[k] };
  s.sb = s.sb ? M.normalize(s.sb) : defaultSb();
  if (Array.isArray(s.characters)) s.characters = s.characters.map(c => ({ ccf: '', voice: '', voiceX: s.voice?.x ?? 280, voiceSize: s.voice?.size ?? 90, ...c }));   // 舊版共用的語音頭像設定分給每個角色
  // 清掉已經拿掉的功能留下的欄位（存檔與 OBS 網址都會變小）
  delete s.voice;
  for (const k of ['mode', 'avatars']) delete s.ccf[k];
  for (const k of ['text', 'bg', 'time', 'place', 'line1', 'line2', 'size', 'size1', 'size2']) delete s.scene[k];
  if (Array.isArray(s.characters)) for (const c of s.characters) for (const k of ['sub', 'icon', 'avatar', 'hp', 'hpMax', 'mp', 'mpMax', 'san', 'sanMax']) delete c[k];
  return Object.assign(structuredClone(DEFAULT), s);
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) return fixState(s);
  } catch (e) {}
  return structuredClone(DEFAULT);
}
let saveTimer;
function commit() {
  if (state.ccf.followTheme) applyThemeColors(state.sb);
  render();
  if (bc) bc.postMessage(state);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('儲存失敗：上傳的圖片太大，建議改用圖片網址'); }
  }, 300);
}
// 網址帶設定時只照網址顯示，不跟瀏覽器存檔同步

/* ---------- 設定 ⇄ 網址 ---------- */
// OBS 瀏覽器來源的網址欄是 Qt 的單行輸入框，最多 32767 字；瀏覽器本身的網址上限約 2MB
const OBS_URL_MAX = 32000, BROWSER_URL_MAX = 2000000;
const obsUrl = async () => location.href.split(/[?#]/)[0] + '?view=output#s=' + await packState();
// 「儲存 OBS 檔案」：存一個只會轉址的小 HTML，OBS 用「本機檔案」開它，就不受網址欄長度限制
let obsFileHandle = null;
async function saveObsFile() {
  const url = await obsUrl();
  if (url.length > BROWSER_URL_MAX) return toast(`設定有 ${(url.length / 1e6).toFixed(1)} MB，超過瀏覽器的上限。請把上傳的圖片（尤其 GIF）改用圖片網址`, 6000);
  const html = '<!doctype html><meta charset="utf-8"><title>TRPG 跑團介面（OBS）</title><style>html,body{margin:0;background:transparent}</style>\n'
    + '<!-- 由 TRPG 跑團介面產生器的「儲存 OBS 檔案」產生，OBS 瀏覽器來源勾「本機檔案」選這個檔 -->\n'
    + `<script>location.replace(${JSON.stringify(url)});<\/script>\n`;
  if (window.showSaveFilePicker) {
    try {
      if (!obsFileHandle) obsFileHandle = await showSaveFilePicker({ suggestedName: 'trpg-obs.html', types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }] });
      const w = await obsFileHandle.createWritable();
      await w.write(html); await w.close();
      return toast(`已儲存「${obsFileHandle.name}」，OBS 來源按右鍵「重新整理」就會更新`, 5000);
    } catch (e) {
      if (e.name === 'AbortError') return;
      obsFileHandle = null;   // 檔案被移走或沒有權限，改用一般下載
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = 'trpg-obs.html'; a.click();
  toast('已下載 trpg-obs.html。之後再下載時，請覆蓋 OBS 正在用的那個檔', 5000);
}
async function packState() {
  const o = structuredClone(state);
  delete o.sb;                                              // 輸出畫面用不到狀態條設定
  o.characters = o.characters.map(c => ({ name: c.name })); // 只需要人數（ID、語音頭像都是角色自己的 OBS 來源）
  const stream = new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function unpackState(text) {
  const bin = atob(text.replace(/-/g, '+').replace(/_/g, '/'));
  const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(stream).text());
}

/* ---------- 工具 ---------- */

/* ---------- CCFOLIA 角色格 ---------- */
// slotInfo[i] = OBS 上該角色瀏覽器來源的擺法（1920×1080 座標）：來源尺寸 w×h、縮放 k、左上角 x,y
let slotInfo = [];
const SLOT_PAD = 6, FALLBACK_SIZE = { w: 358, h: 127 };
function sizeOf(i) {
  const known = state.ccf.sizes.filter(Boolean);
  return state.ccf.sizes[i] || known[0] || FALLBACK_SIZE;
}
function layoutSlots(st) {
  slotInfo = [];
  const box = st.querySelector('#chars');
  if (!box) return;
  const slots = [...box.children], n = slots.length;
  if (!n) return;
  const cs = getComputedStyle(box);
  const gap = parseFloat(cs.rowGap) || 0;
  const innerH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const maxH = (innerH - gap * (n - 1)) / n - SLOT_PAD * 2 - 2;
  const fits = slots.map((el, i) => {
    const sz = sizeOf(i), availW = el.clientWidth - SLOT_PAD * 2;
    const k = Math.min(1, availW / sz.w, maxH / sz.h);
    el.style.height = `${sz.h * k + SLOT_PAD * 2 + 2}px`;
    return { ...sz, k, availW };
  });
  // 高度都定好之後再量位置（用版面座標，不受預覽縮放影響）
  const posIn = el => {
    let x = 0, y = 0;
    for (; el && el !== st; el = el.offsetParent) {
      x += el.offsetLeft; y += el.offsetTop;
      if (el.offsetParent && el.offsetParent !== st) { x += el.offsetParent.clientLeft; y += el.offsetParent.clientTop; }
    }
    return { x, y };
  };
  slotInfo = slots.map((el, i) => {
    const p = posIn(el), f = fits[i];
    return {
      w: f.w, h: f.h, k: f.k,
      box: { x: p.x, y: p.y, w: el.offsetWidth, h: el.offsetHeight },   // 角色格外框（語音頭像用）
      x: Math.round(p.x + el.clientLeft + SLOT_PAD + (f.availW - f.w * f.k) / 2),
      y: Math.round(p.y + el.clientTop + SLOT_PAD),
    };
  });
  updateObsInfo();
}
const charUrl = c => M.characterUrl(state.ccf.room, c.ccf);
const voiceUrl = c => /^https:\/\/reactive\.fugi\.tech\/\S+$/.test(String(c.voice || '').trim()) ? String(c.voice).trim() : '';
const charCss = i => {
  const c = state.characters[i];
  return C.build(state.sb, { name: c.name, color: c.color, url: charUrl(c), size: sizeOf(i) });
};
function updateObsInfo() {
  if (OUTPUT) return;
  slotInfo.forEach((f, i) => {
    const el = ed.querySelector(`[data-obs="${i}"]`);
    if (!el) return;
    const shrink = f.k < 0.995;
    el.classList.toggle('warn', shrink);
    el.innerHTML = `CCFOLIA 瀏覽器來源：寬 <b>${f.w}</b> × 高 <b>${f.h}</b><br>編輯變形 → 位置 <b>${f.x}, ${f.y}</b>　大小 <b>${Math.round(f.w * f.k)} × ${Math.round(f.h * f.k)}</b>`
      + (shrink ? `<br>⚠ 放不下，已縮小成 ${Math.round(f.k * 100)}%。字會變小，建議把「單條寬度」或頭像調小。` : '');
    const vo = ed.querySelector(`[data-voiceobs="${i}"]`), v = voicePos(i);
    if (vo && v) vo.innerHTML = `Reactive 瀏覽器來源：寬 <b>${v.size}</b> × 高 <b>${v.size}</b><br>編輯變形 → 位置 <b>${v.x}, ${v.y}</b>`;
  });
}

/* ---------- 編輯器預覽：用 CCFOLIA 模擬畫面疊在角色格上 ---------- */
const frames = [];
let sizeTimer;
function previewData(i, css) {
  const statuses = P.SAMPLE_STATUS.slice(0, state.sb.layout.count);
  return { css, statuses, initiative: 12, avatar: null };   // 先攻值、頭像都用範例
}
function measureFrame(i) {
  const f = frames[i];
  if (!f?.doc) return;
  const sz = K.measure(f.doc), old = state.ccf.sizes[i];
  f.iframe.style.width = sz.w + 'px';
  f.iframe.style.height = sz.h + 'px';
  if (old && old.w === sz.w && old.h === sz.h) return;
  state.ccf.sizes[i] = sz;
  clearTimeout(sizeTimer);
  sizeTimer = setTimeout(commit, 30);
}
function syncPreviews() {
  if (OUTPUT) return;
  const layer = $('#sbLayer'), n = state.characters.length;
  while (frames.length > n) frames.pop().iframe.remove();
  if (state.ccf.sizes.length > state.characters.length) state.ccf.sizes.length = state.characters.length;
  for (let i = 0; i < n; i++) {
    let f = frames[i];
    if (!f) {
      const iframe = document.createElement('iframe');
      iframe.tabIndex = -1;
      iframe.style.cssText = 'width:1200px;height:900px;visibility:hidden';
      f = frames[i] = { iframe, doc: null, key: '' };
      iframe.addEventListener('load', () => { f.doc = iframe.contentDocument; f.key = ''; syncPreviews(); });
      iframe.srcdoc = K.documentHtml();
      layer.append(iframe);
    }
    if (f.doc) {
      const data = previewData(i, charCss(i));
      const key = JSON.stringify(data);
      if (key !== f.key) {
        f.key = key;
        K.update(f.doc, data);
        measureFrame(i);
        f.doc.fonts.ready.then(() => measureFrame(i));   // 網路字型載入後尺寸會變
      }
    }
    const s = slotInfo[i];
    if (s) Object.assign(f.iframe.style, { left: s.x + 'px', top: s.y + 'px', transform: `scale(${s.k})`, visibility: f.doc ? 'visible' : 'hidden' });
  }
}

/* ---------- 語音：Reactive 單人頭像 ----------
   在 OBS 裡是每個角色各自的瀏覽器來源（跟 CCFOLIA 來源一樣），這裡只在編輯器預覽並算出要填的位置 */
const voiceFrames = [];
// 語音頭像在 1920×1080 上的位置：角色格左邊 + voiceX，上下置中
function voicePos(i) {
  const c = state.characters[i], s = slotInfo[i];
  if (!s) return null;
  const size = Number(c.voiceSize) || 90, b = s.box;
  return { x: Math.round(b.x + (Number(c.voiceX) || 0)), y: Math.round(b.y + (b.h - size) / 2), size };
}
function syncVoice() {
  if (OUTPUT) return;
  const layer = $('#voiceLayer'), n = state.characters.length;
  while (voiceFrames.length > n) voiceFrames.pop()?.remove();
  for (let i = 0; i < n; i++) {
    const url = voiceUrl(state.characters[i]), s = slotInfo[i];
    let fr = voiceFrames[i];
    if (!url || !s) { if (fr) { fr.remove(); voiceFrames[i] = null; } continue; }
    if (!fr) {
      fr = voiceFrames[i] = document.createElement('iframe');
      fr.tabIndex = -1;
      fr.setAttribute('allowtransparency', 'true');
      layer.append(fr);
    }
    if (fr.dataset.src !== url) { fr.dataset.src = url; fr.src = url; }   // 只在網址改變時重新載入
    const v = voicePos(i);
    Object.assign(fr.style, { left: v.x + 'px', top: v.y + 'px', width: v.size + 'px', height: v.size + 'px' });
  }
}

function fit() {
  const w = $('#wrap'), sc = Math.min(w.clientWidth / 1920, w.clientHeight / 1080);
  const tf = `translate(${(w.clientWidth - 1920 * sc) / 2}px,${(w.clientHeight - 1080 * sc) / 2}px) scale(${sc})`;
  $('#stage').style.transform = tf;
  $('#sbLayer').style.transform = tf;
  $('#voiceLayer').style.transform = tf;
}
window.addEventListener('resize', fit);
// 網路字型載入後標題高度會變，角色格位置要重算（不然顯示的 OBS 位置會差幾 px）
document.fonts.addEventListener('loadingdone', () => render());

/* ---------- 編輯器 ---------- */
const txt = (label, path, ph = '') => `<label class="f">${label}</label><input type="text" data-path="${path}" value="${esc(getPath(path))}" placeholder="${esc(ph)}">`;

const pxRange = (label, path, min, max) => `<label class="f">${label}：<span data-show="${path}">${esc(getPath(path))}</span>px</label><input type="range" min="${min}" max="${max}" data-path="${path}" data-num value="${esc(getPath(path))}" style="width:100%">`;

/* ---------- 編輯器：CCFOLIA 狀態條設定（控制項對應 scTool 的各分頁） ---------- */
let sbTab = 'layout';
const sv = p => getPath('sb.' + p);
const SR = (label, ctrl, cond) => `<div class="sr"${cond ? ` data-if="${esc(cond)}"` : ''}><span class="sl">${label}</span>${ctrl}</div>`;
const SIF = (cond, html) => `<div data-if="${esc(cond)}">${html}</div>`;
const SG = t => `<div class="sgroup">${t}</div>`;
const sRange = (p, min, max, step, fmt = '') => `<span class="wv"><input type="range" data-path="sb.${p}" data-num min="${min}" max="${max}" step="${step}" value="${esc(sv(p))}"><output data-out="${p}" data-fmt="${fmt}"></output></span>`;
const sSel = (p, list, isNum) => `<select data-path="sb.${p}"${isNum ? ' data-num' : ''}>${list.map(([v, t]) => `<option value="${esc(v)}"${String(sv(p)) === String(v) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
const sChk = (p, text) => `<label class="ck"><input type="checkbox" data-path="sb.${p}"${sv(p) ? ' checked' : ''}>${text}</label>`;
const sCol = p => `<input type="color" data-path="sb.${p}" value="${esc(sv(p))}">`;
const sColA = (c, a) => `<span class="ca">${sCol(c)}<input type="range" data-path="sb.${a}" data-num min="0" max="1" step="0.01" value="${esc(sv(a))}"><output data-out="${a}" data-fmt="pct"></output></span>`;
const fontList = () => Object.entries(P.FONTS).map(([k, v]) => [k, v.label]);
const sFont = (label, p, nameP) => SR(label, sSel(p, fontList()))
  + SR('字型名稱', `<span class="pcf"><input type="text" data-path="sb.${nameP}" value="${esc(sv(nameP))}" placeholder="例）Microsoft JhengHei" spellcheck="false"><button data-pcfont${window.PcFonts?.supported ? '' : ' hidden'}>從清單選擇</button></span>`, `${p}=pc`);

function sbFormat(v, fmt) {
  const r = Math.round(v * 100) / 100;
  switch (fmt) {
    case 'pct': return Math.round(v * 100) + '%';
    case 'px': return r + 'px';
    case 'sec': return v > 0 ? r + ' 秒' : '無';
    case 'em': return r.toFixed(2);
    case 'bars': return v + ' 條';
    case 'seg': return v > 1 ? v + ' 段' : '無';
    case 'under': return '低於 ' + v + '%';
    default: return String(r);
  }
}
// 同 scTool：「a=x|y」a 是 x 或 y；「a!=x」a 不是 x；用「&」串接；「|」後面也可以接另一個條件
function sbCond(cond) {
  return cond.split('&').every(part => {
    const clauses = [];
    for (const piece of part.split('|')) {
      if (/^[\w.]+!?=/.test(piece)) clauses.push({ raw: piece, values: [] });
      else if (clauses.length) clauses[clauses.length - 1].values.push(piece);
    }
    return clauses.some(cl => {
      const m = cl.raw.match(/^([\w.]+)(!?=)(.*)$/);
      const hit = [m[3], ...cl.values].includes(String(sv(m[1])));
      return m[2] === '=' ? hit : !hit;
    });
  });
}
function sbRefresh() {
  for (const el of ed.querySelectorAll('[data-if]')) el.hidden = !sbCond(el.dataset.if);
  for (const o of ed.querySelectorAll('output[data-out]')) { const v = sv(o.dataset.out); if (typeof v === 'number') o.textContent = sbFormat(v, o.dataset.fmt); }
}

    <details data-k="obs"><summary>📡 OBS 設定方式</summary><div class="sec">
      <p class="hint">OBS 來源由下到上的順序：<b>劇情畫面的圖片／影片 → 跑團介面 → 各角色的 CCFOLIA → 各角色的 Reactive</b>（對話區、聊天室、Live2D 等也放在跑團介面上面）。</p>
      <ol class="note-ol">
        <li>OBS 的畫布設 1920×1080。介面本身用「瀏覽器來源」，網址貼上「複製 OBS 網址」的內容（或勾「本機檔案」選「儲存 OBS 檔案」存的檔），寬 1920、高 1080，位置 0, 0。</li>
        <li>每個角色各「新增來源 → 瀏覽器」，網址貼上該角色的「複製 CCFOLIA 網址」，寬高填角色底下顯示的 <b>CCFOLIA 瀏覽器來源</b>尺寸。</li>

        <li>畫面一片空白時：來源右鍵 →「互動」，登入 CCFOLIA 並進入房間（做過一次就會記住）。</li>
        <li>第二位角色開始請<b>重新「新增來源」</b>建立，不要用「貼上（參照）」，否則全部都會變成同一個角色。</li>
        <li>有語音頭像的角色：再「新增來源 → 瀏覽器」，網址貼「複製 Reactive 網址」，寬高與位置照角色底下的 <b>Reactive 瀏覽器來源</b>數字填。放在該角色 CCFOLIA 來源的<b>上面</b>（不會被狀態條蓋住），兩個來源選起來按右鍵「群組選取的項目」，之後就會一起移動。</li>
      </ol>
      <p class="hint">CCFOLIA 角色「狀態」的排列順序對應第 1、2、3 條的顏色（例：HP → MP → SAN）。聊天室輸入 <code>:HP-3</code>、<code>:SAN=45</code> 之類的指令，OBS 也會立刻更新。改了狀態條樣式或人數之後，要重新複製各角色的 CSS、核對尺寸與位置，跑團介面本身也要重新「複製 OBS 網址」或「儲存 OBS 檔案」（角色格會跟著變）。</p>
    </div></details>`;
  if (wasOpen) for (const d of ed.querySelectorAll('details')) d.open = wasOpen.has(d.dataset.k);
  sbRefresh();
  updateCharNotes();
  updateObsInfo();
}
function updateCharNotes() {
  for (const el of ed.querySelectorAll('[data-voicenote]')) {
    const c = state.characters[el.dataset.voicenote], v = String(c.voice || '').trim();
    el.style.color = '#ffb86b';
    el.textContent = !v ? '' : !voiceUrl(c) ? '要貼 https://reactive.fugi.tech/ 開頭的網址。'
      : (el.style.color = '', '在 OBS 另外新增一個瀏覽器來源放這個 Reactive 網址，照下面的數字擺，再跟這個角色的 CCFOLIA 來源設成同一個群組，就會一起移動。');
  }
  for (const el of ed.querySelectorAll('[data-note]')) {
    const c = state.characters[el.dataset.note];
    el.textContent = !M.parseCharacter(c.ccf) ? '填入角色 ID 後就能產生網址。'
      : (!M.parseRoom(state.ccf.room) && !/rooms\//.test(c.ccf)) ? '填入上面的房間網址後就能產生網址。' : '';
  }
}

const ed = $('#editor');
ed.addEventListener('input', e => {
  const t = e.target, p = t.dataset.path;
  if (!p) return;
  if (t.value === '(已上傳圖片)') return;
  setPath(p, t.type === 'checkbox' ? t.checked : 'num' in t.dataset ? (t.value === '' ? '' : Number(t.value)) : t.value);
  if (p === 'kp.show' || p === 'talk.show') buildEditor();
  if (p === 'ccf.followTheme') {
    if (!t.checked) applyThemeColors(state.sb);   // 取消時保留目前看到的顏色
    commit(); buildEditor(); return;
  }
  const shown = ed.querySelector(`[data-show="${p}"]`);
  if (shown) shown.textContent = t.value;
  if (p.startsWith('theme.')) $('#rtcLink').href = rtcUrl();
  commit();
  if (p.startsWith('sb.')) sbRefresh();
  if (p === 'ccf.room' || /^characters\.\d+\.(ccf|voice)$/.test(p)) updateCharNotes();
  const nm = p.match(/^characters\.(\d+)\.name$/);
  if (nm) ed.querySelectorAll('.char-h span')[nm[1]].textContent = `#${+nm[1] + 1} ${t.value}`;
});
ed.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const cs = state.characters;
  if (t.dataset.sinfo) {
    const [k, v] = t.dataset.sinfo.split(':');
    state.scene[k] = k === 'lines' ? Number(v) : v;
    buildEditor(); commit();
  } else if (t.dataset.sbtab) {
    sbTab = t.dataset.sbtab;
    for (const b of ed.querySelectorAll('[data-sbtab]')) b.classList.toggle('on', b === t);
    for (const p of ed.querySelectorAll('[data-sbpanel]')) p.hidden = p.dataset.sbpanel !== sbTab;
  } else if (t.id === 'sbApply') {
    const key = $('#sbDesign').value;
    M.applyDesign(state.sb, key);
    state.ccf.followTheme = key === 'overlay';
    commit(); buildEditor(); toast(`已套用「${P.DESIGNS[key].label}」`);
  } else if (t.dataset.copy) {
    const i = +t.dataset.i, c = cs[i];
    if (t.dataset.copy === 'voice') {
      const v = voicePos(i);
      copyText(voiceUrl(c)).then(ok => toast(ok ? `已複製「${c.name}」的 Reactive 網址（來源 ${v?.size}×${v?.size}）` : '複製失敗'));
    } else if (t.dataset.copy === 'url') {
      const url = charUrl(c);
      if (!url) return toast('需要同時填入房間網址與角色 ID');
      copyText(url).then(ok => toast(ok ? `已複製「${c.name}」的 CCFOLIA 網址` : '複製失敗'));
    } else {
      const sz = sizeOf(i);
      copyText(charCss(i)).then(ok => toast(ok ? `已複製「${c.name}」的 CSS（來源尺寸 ${sz.w}×${sz.h}）` : '複製失敗'));
    }
  } else if ('pcfont' in t.dataset) {
    window.PcFonts?.open(t.closest('.pcf').querySelector('input'));
  } else if (t.dataset.act) {
    const i = +t.dataset.i;
    if (t.dataset.act === 'del' && confirm(`刪除角色「${cs[i].name}」？`)) cs.splice(i, 1);
    if (t.dataset.act === 'up' && i > 0) [cs[i - 1], cs[i]] = [cs[i], cs[i - 1]];
    if (t.dataset.act === 'down' && i < cs.length - 1) [cs[i + 1], cs[i]] = [cs[i], cs[i + 1]];
    buildEditor(); commit();
  } else if (t.dataset.clear) {
    setPath(t.dataset.clear, ''); buildEditor(); commit();
  } else if (t.id === 'addChar') {
    cs.push({ name: '新角色', color: '#c4b5fd', ccf: '', voice: '', voiceX: 280, voiceSize: 90 });
    buildEditor(); commit();
  } else if (t.id === 'obsUrl') {
    obsUrl().then(url => {
      if (url.length > OBS_URL_MAX) return toast(`網址有 ${Math.round(url.length / 1000)} 千字，OBS 的網址欄最多約 3.2 萬字，貼了會被截斷。請改用「儲存 OBS 檔案」`, 6000);
      copyText(url).then(ok => toast(ok ? '已複製 OBS 網址，貼到 OBS 瀏覽器來源的網址欄' : '複製失敗'));
    });
  } else if (t.id === 'obsFile') {
    saveObsFile();
  } else if (t.id === 'exp') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
    a.download = `trpg-${String(state.title || 'overlay').replace(/[\\/:*?"<>|]/g, '_').trim() || 'overlay'}.json`; a.click();
  } else if (t.dataset.fit) {
    const [key, fit] = t.dataset.fit.split(':');
    state[key].fit = fit; buildEditor(); commit();
  } else if (t.dataset.bgreset) {
    Object.assign(state[t.dataset.bgreset], { zoom: 100, x: 0, y: 0 }); buildEditor(); commit();
  } else if (t.dataset.mode) {
    state.theme.mode = t.dataset.mode; buildEditor(); commit();
  } else if (t.id === 'randColor') {
    state.theme.colors = randomPalette(); buildEditor(); commit();
  } else if (t.id === 'resetColor') {
    state.theme.colors = structuredClone(DEFAULT.theme.colors); buildEditor(); commit();
  } else if (t.id === 'rtcApply') {
    const c = parseRtc($('#rtcIn').value);
    if (!c) return toast('讀不到配色：網址裡要有 colors=xxxxxx-xxxxxx-xxxxxx-xxxxxx-xxxxxx');
    state.theme.colors = c; buildEditor(); commit(); toast('已套用配色');
  } else if (t.id === 'reset') {
    if (confirm('重設成範例資料？目前內容會被覆蓋（建議先匯出）')) { state = structuredClone(DEFAULT); buildEditor(); commit(); }
  }
});
ed.addEventListener('change', e => {
  const t = e.target;
  // 這些會讓編輯器的列數或提示改變，放開滑桿／輸入完才重建（拖曳中重建會中斷拖曳）
  if (t.dataset.path === 'sb.layout.count' || /^characters\.\d+\.voice$/.test(t.dataset.path || '')) buildEditor();

  } else if (t.id === 'imp' && t.files[0]) {

/* ---------- 配色 ---------- */
// 順序同 Realtime Colors 網址：colors=text-background-primary-secondary-accent
const COLOR_KEYS = [['text', '文字'], ['bg', '背景'], ['pri', '主色<br>框線'], ['sec', '次色<br>角落/標籤'], ['acc', '強調<br>裝飾']];
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d) {
    s = d / (1 - Math.abs(2 * l - 1));
    h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  }
  return [(h * 60 + 360) % 360, s * 100, l * 100];
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const f = n => { const k = (n + h / 30) % 12, c = l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}
const invert = hex => { const [h, s, l] = hexToHsl(hex); return hslToHex(h, s, 100 - l); };
// 實際顯示用的 5 色：配色本身的深淺跟選的模式不同時，整組反轉明暗
function effColors() {
  const { mode, colors } = state.theme;
  const flip = (hexToHsl(colors.bg)[2] < 50) !== (mode === 'dark');
  return Object.fromEntries(COLOR_KEYS.map(([k]) => [k, flip ? invert(colors[k]) : colors[k]]));
}
function applyTheme(st) {
  const c = effColors(), mode = state.theme.mode;
  for (const [k] of COLOR_KEYS) st.style.setProperty('--' + k, c[k]);
  st.dataset.mode = mode;
  document.getElementById('wrap').style.background = mode === 'light' ? '#d9d5df' : '#050407';
}
// 把介面配色寫進狀態條設定（顏色跟隨介面配色）
function applyThemeColors(sb) {
  const c = effColors(), mode = state.theme.mode, st = STAT_COLORS[mode];
  const deep = hex => { const [h, s, l] = hexToHsl(hex); return hslToHex(h, s, l * 0.55); };
  ['hp', 'mp', 'san'].forEach((k, i) => Object.assign(sb.bars[i], { c1: st[k], c2: deep(st[k]) }));
  Object.assign(sb.text, { color: c.text, subColor: c.text, outlineColor: mode === 'dark' ? '#000000' : c.bg });
  Object.assign(sb.bar, { borderColor: c.pri, trackColor: c.bg });
  Object.assign(sb.name, { color: c.text, bg: c.bg, accent: c.sec });
  Object.assign(sb.avatar, { borderColor: c.sec, bg: c.bg });
  Object.assign(sb.initiative, { color: c.bg, bg: c.sec });
  Object.assign(sb.alert, { lowColor: st.hp });
  Object.assign(sb.decos.panel, { color: c.bg, borderColor: c.pri });
  Object.assign(sb.decos.frame, { color: c.sec });
  Object.assign(sb.decos.brackets, { color: c.acc });
  Object.assign(sb.decos.ticks, { color: c.text });
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.append(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove(); return ok;
  }
}
function randomPalette() {
  const r = (a, b) => a + Math.random() * (b - a), h = r(0, 360);
  return {
    text: hslToHex(h, r(40, 80), r(88, 94)),
    bg: hslToHex(h, r(35, 75), r(3, 7)),
    pri: hslToHex((h + r(-15, 15) + 360) % 360, r(55, 85), r(68, 80)),
    sec: hslToHex((h + [30, -30, 150, 180, 210][Math.floor(r(0, 5))] + 360) % 360, r(45, 75), r(55, 68)),
    acc: hslToHex((h + r(40, 320)) % 360, r(70, 95), r(55, 68)),
  };
}
function parseRtc(raw) {
  raw = raw.trim();
  let v = raw;
  try { v = new URL(raw).searchParams.get('colors') || ''; } catch (e) {}
  const parts = v.split('-').map(x => x.trim().replace(/^#/, ''));
  if (parts.length < 5 || !parts.slice(0, 5).every(x => /^[0-9a-f]{6}$/i.test(x))) return null;
  return Object.fromEntries(COLOR_KEYS.map(([k], i) => [k, '#' + parts[i].toLowerCase()]));
}
function rtcUrl() {
  return 'https://www.realtimecolors.com/?colors=' + COLOR_KEYS.map(([k]) => state.theme.colors[k].slice(1)).join('-') + '&fonts=Inter-Inter';
}

// 上傳圖片時縮小成 webp，避免塞爆瀏覽器儲存空間
function readImage(file, maxSize = 1280) {
  // GIF 用原檔（縮小重畫會只剩第一格、動畫消失）
  if (file.type === 'image/gif') {
    if (file.size > 1024 * 1024) toast(`GIF 有 ${(file.size / 1024 / 1024).toFixed(1)} MB，OBS 網址可能會太長貼不上，建議改用圖片網址`);
    return new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(file); });
  }
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const r = Math.min(1, maxSize / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/webp', 0.85));
      URL.revokeObjectURL(im.src);
    };
    im.src = URL.createObjectURL(file);
  });
}

(async () => {
  if (PACKED) {
    try { state = fixState(await unpackState(PACKED)); }
    catch (e) {
      // 不要默默顯示預設內容，直接在畫面上說明
      console.error('網址裡的設定讀不到', e);
      document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;left:20px;top:20px;z-index:99;padding:14px 20px;background:#5a1d2b;color:#fff;font:20px/1.6 sans-serif;border-radius:8px;max-width:80%">讀不到網址裡的設定，網址可能太長被截斷了。<br>請在產生器改用「儲存 OBS 檔案」，或把上傳的圖片改用圖片網址。</div>');
    }
  }
  if (state.ccf.followTheme) applyThemeColors(state.sb);
  buildEditor();
  fit();
  render();
})();
